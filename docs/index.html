<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="robots" content="noindex">
<title>会議室状況</title>
<style>
  :root {
    --bg:#f6f7f9; --card:#fff; --text:#16181d; --sub:#5b6270; --line:#e3e6ec;
    --free:#15803d; --free-bg:#dcfce7; --busy:#b91c1c; --busy-bg:#fee2e2;
    --bar:#cbd5e1; --bar-busy:#1d4ed8; --accent:#1d4ed8; --warn-bg:#fef3c7; --warn:#92400e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#eceef2; --sub:#9aa3b2; --line:#272b34;
      --free:#4ade80; --free-bg:#14301f; --busy:#f87171; --busy-bg:#3a1618; --bar:#2c313b; --bar-busy:#60a5fa; --accent:#60a5fa;
      --warn-bg:#3a2e12; --warn:#fbbf24; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  h1 { font-size:20px; margin:0; }
  .meta { font-size:13px; color:var(--sub); }
  .note { border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:12px; }
  .err { background:var(--busy-bg); color:var(--busy); }
  .warn { background:var(--warn-bg); color:var(--warn); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .name { font-weight:700; font-size:17px; }
  .badge { font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .free .badge { background:var(--free-bg); color:var(--free); }
  .busy .badge { background:var(--busy-bg); color:var(--busy); }
  .line { font-size:14px; color:var(--sub); margin-top:6px; overflow-wrap:anywhere; }
  .line b { color:var(--text); font-weight:600; }
  .tl { position:relative; height:10px; border-radius:5px; background:var(--bar); margin:12px 0 4px; overflow:hidden; }
  .tl i { position:absolute; top:0; bottom:0; background:var(--bar-busy); opacity:.85; }
  .tl u { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--text); }
  .ticks { display:flex; justify-content:space-between; font-size:11px; color:var(--sub); }
  a.book, button { display:block; width:100%; text-align:center; margin-top:12px; padding:11px; border:0; border-radius:10px;
    background:var(--accent); color:#fff; text-decoration:none; font:inherit; font-weight:600; }
  input[type=password] { width:100%; padding:11px; font:inherit; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); margin-top:8px; }
  label.rem { display:block; font-size:14px; color:var(--sub); margin-top:10px; }
  .empty { color:var(--sub); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>会議室状況</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div id="note" class="note" hidden></div>

  <form id="login" class="card" hidden>
    <div class="name">合言葉を入力</div>
    <input type="password" id="pass" autocomplete="current-password" placeholder="合言葉" required>
    <label class="rem"><input type="checkbox" id="remember"> この端末に合言葉を保存する</label>
    <button type="submit">表示する</button>
  </form>

  <div id="list"></div>
</div>

<script>
const START = 8, END = 20;                 // タイムラインの表示範囲(時)
const POLL_MS = 120000;                    // 取得間隔(GitHubの無認証アクセス上限に余裕を持たせる)
const STALE_MIN = 20;                      // これより古いデータには注意書きを出す
const $ = (id) => document.getElementById(id);

// リポジトリは URL から決める(owner.github.io/repo/)。?repo=owner/name でも指定できる
function repoName() {
  const q = new URLSearchParams(location.search).get("repo");
  if (q) return q;
  const m = location.hostname.match(/^(.+)\.github\.io$/);
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return m && seg ? m[1] + "/" + seg : "";
}

let pass = "", etag = "", lastPayload = null, timer = null;
const store = {
  get() { try { return localStorage.getItem("mr_pass") || ""; } catch (e) { return ""; } },
  set(v) { try { localStorage.setItem("mr_pass", v); } catch (e) {} },
  del() { try { localStorage.removeItem("mr_pass"); } catch (e) {} },
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;     // 外部データは textContent のみで表示
  return e;
}
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function decrypt(box, passphrase) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(box.salt), iterations: box.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function showNote(text, cls) {
  const n = $("note");
  n.hidden = !text;
  n.className = "note " + (cls || "");
  n.textContent = text || "";
}

// ---- 表示 ----
const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const pct = (min) => Math.max(0, Math.min(100, (min / 60 - START) / (END - START) * 100));
const resText = (r) => hhmm(r.s) + "–" + hhmm(r.e) + "  " + r.t + (r.u ? "(" + r.u + ")" : "");

function bookUrl(room, group, now) {
  const start = new Date(now.getTime());
  start.setMinutes(now.getMinutes() < 30 ? 30 : 60, 0, 0);
  const end = new Date(start.getTime() + 3600000);
  const q = new URLSearchParams({
    facility_id: room.fid, facility_group_id: group,
    "event_start[year]": start.getFullYear(), "event_start[month]": start.getMonth() + 1, "event_start[day]": start.getDate(),
    "event_start[hour]": start.getHours(), "event_start[minute]": start.getMinutes(),
    "event_end[year]": end.getFullYear(), "event_end[month]": end.getMonth() + 1, "event_end[day]": end.getDate(),
    "event_end[hour]": end.getHours(), "event_end[minute]": end.getMinutes(),
  });
  return "https://gridy.jp/schedule/new?" + q.toString();
}

function render(p) {
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const today = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  $("meta").textContent = "更新 " + p.updated.slice(11, 16);

  const ageMin = (now - new Date(p.updated)) / 60000;
  if (p.date !== today) {
    showNote("今日のデータではありません(" + p.date + ")。PC側の送信が止まっている可能性があります。", "warn");
    $("list").replaceChildren();   // 古い予約を「今」として表示しない
    return;
  } else if (ageMin > STALE_MIN) showNote("最終更新から " + Math.round(ageMin) + " 分たっています。PC側の送信が止まっている可能性があります。", "warn");
  else showNote("");

  const list = $("list");
  list.replaceChildren();
  if (!p.rooms.length) { list.append(el("div", "empty", "表示する会議室がありません")); return; }

  for (const r of p.rooms) {
    const cur = r.items.find((i) => i.s <= nowMin && nowMin < i.e);
    const next = r.items.find((i) => i.s > nowMin);
    const card = el("div", "card " + (cur ? "busy" : "free"));
    const top = el("div", "top");
    top.append(el("span", "name", r.name), el("span", "badge", cur ? "予約中" : "空き"));
    card.append(top);
    if (cur) { const d = el("div", "line"); d.append(el("b", "", "今 "), document.createTextNode(resText(cur))); card.append(d); }
    if (next) { const d = el("div", "line"); d.append(el("b", "", "次 "), document.createTextNode(resText(next))); card.append(d); }
    else if (!cur) card.append(el("div", "line", "この後の予約はありません"));

    const tl = el("div", "tl");
    for (const b of r.items) {
      if (b.e <= START * 60 || b.s >= END * 60) continue;
      const i = document.createElement("i");
      i.style.left = pct(b.s) + "%"; i.style.width = (pct(b.e) - pct(b.s)) + "%";
      tl.append(i);
    }
    if (nowMin >= START * 60 && nowMin <= END * 60) { const u = document.createElement("u"); u.style.left = pct(nowMin) + "%"; tl.append(u); }
    card.append(tl);
    const ticks = el("div", "ticks");
    for (let h = START; h <= END; h += 3) ticks.append(el("span", "", h + "時"));
    card.append(ticks);

    if (r.fid) {
      const a = el("a", "book", "GRIDYで予約する");
      a.href = bookUrl(r, p.group, now); a.rel = "noopener";
      card.append(a);
    }
    list.append(card);
  }
}

// ---- 取得 ----
async function load() {
  const repo = repoName();
  if (!repo) { showNote("リポジトリを特定できません。URLに ?repo=ユーザー名/リポジトリ名 を付けてください。", "err"); return; }
  try {
    const headers = { Accept: "application/vnd.github.raw+json" };
    if (etag) headers["If-None-Match"] = etag;
    const res = await fetch("https://api.github.com/repos/" + repo + "/contents/status.json", { headers, cache: "no-store" });
    if (res.status === 304) { if (lastPayload) render(lastPayload); return; }
    if (res.status === 404) throw new Error("データがまだ届いていません(PC側の送信を確認してください)");
    if (res.status === 403) throw new Error("GitHubのアクセス上限です。しばらくしてからもう一度開いてください");
    if (!res.ok) throw new Error("取得に失敗しました (" + res.status + ")");
    etag = res.headers.get("ETag") || "";
    let payload;
    try { payload = await decrypt(JSON.parse(await res.text()), pass); }
    catch (e) { throw Object.assign(new Error("合言葉が違うか、データが壊れています"), { badPass: true }); }
    lastPayload = payload;
    render(payload);
  } catch (e) {
    if (e.badPass) { store.del(); etag = ""; clearInterval(timer); askPass(e.message); return; }
    showNote(e.message || "接続できません", "err");
  }
}

function askPass(msg) {
  $("login").hidden = false;
  $("list").replaceChildren();
  showNote(msg || "", msg ? "err" : "");
}

$("login").addEventListener("submit", (ev) => {
  ev.preventDefault();
  pass = $("pass").value;
  if ($("remember").checked) store.set(pass);
  $("login").hidden = true;
  showNote("");
  start();
});

function start() {
  clearInterval(timer);
  load();
  timer = setInterval(load, POLL_MS);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && pass) load(); });

pass = store.get();
if (pass) start(); else askPass();
</script>
</body>
</html>
